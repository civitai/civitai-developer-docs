# ── CONTENT NEGOTIATION (Accept: text/markdown) ─────────────────────────────
#
# These maps sit OUTSIDE `server {}` because `map` is http-context only; the
# runtime image includes this file from `http {}` (conf.d), so that is legal.
#
# THE RULE: serve a page's `.md` twin instead of its HTML when the request's
# Accept lists `text/markdown` with a q-value AT LEAST that of `text/html`
# (a tie goes to markdown: a client that names markdown at all asked for it).
#   `text/markdown, text/html, */*`  (Claude Code's WebFetch)  -> markdown
#   `text/html,application/xhtml+xml,…` (every browser)        -> HTML
#   `*/*` or no Accept (curl, crawlers)                         -> HTML
#   `text/markdown;q=0.5, text/html;q=0.9`                      -> HTML
#   `text/markdown;q=0` (explicitly NOT acceptable)             -> HTML
# A URL with no twin always gets the HTML — a markdown Accept never earns a 404.
#
# nginx has no arithmetic, so the comparison is done on strings: each q-value is
# normalised to four digits (1 -> 1000, 0.9 -> 0900, 0.85 -> 0850) and the pair
# "<md>:<html>" is compared by the last map. Its long regex is "md >= html" for
# two equal-length digit strings: a shared prefix (\1), then a first differing
# digit that is larger on the markdown side. `scripts/test-nginx-negotiation.mjs`
# drives these maps through a real nginx, q-value cases included.
#
# No `{n}` regex quantifiers anywhere in this file: `check-ai-catalog.mjs`
# attributes `add_header` lines to `location` blocks by counting braces.

# The q-value of `text/markdown` in Accept: its explicit q, "1" when listed with
# none, "" when not listed at all.
map $http_accept $accept_md_q {
  default "";
  "~*(?:^|,)\s*text/markdown\s*;[^,]*?\bq\s*=\s*(?<mdq>[0-9.]+)" $mdq;
  "~*(?:^|,)\s*text/markdown\s*(?:;|,|$)" 1;
}

# Same for `text/html`.
map $http_accept $accept_html_q {
  default "";
  "~*(?:^|,)\s*text/html\s*;[^,]*?\bq\s*=\s*(?<htq>[0-9.]+)" $htq;
  "~*(?:^|,)\s*text/html\s*(?:;|,|$)" 1;
}

# Normalise to four digits; "-" = not listed (or a malformed q).
map $accept_md_q $md_qn {
  default "-";
  "~^1(?:\.0*)?$" 1000;
  "~^0?\.(?<m1>\d)(?<m2>\d)(?<m3>\d)0*$" "0$m1$m2$m3";
  "~^0?\.(?<m1>\d)(?<m2>\d)$" "0$m1${m2}0";
  "~^0?\.(?<m1>\d)$" "0${m1}00";
  "~^0*\.?0*$" 0000;
}

map $accept_html_q $html_qn {
  default "-";
  "~^1(?:\.0*)?$" 1000;
  "~^0?\.(?<h1>\d)(?<h2>\d)(?<h3>\d)0*$" "0$h1$h2$h3";
  "~^0?\.(?<h1>\d)(?<h2>\d)$" "0$h1${h2}0";
  "~^0?\.(?<h1>\d)$" "0${h1}00";
  "~^0*\.?0*$" 0000;
}

# 1 = markdown preferred. First matching regex wins, so order is load-bearing.
map "$md_qn:$html_qn" $prefers_md {
  default 0;
  "~^-" 0;
  "~^0000:" 0;
  "~^\d\d\d\d:-$" 1;
  "~^(\d\d\d\d):\1$" 1;
  "~^(\d*)(?:1\d*:\1[0]|2\d*:\1[01]|3\d*:\1[0-2]|4\d*:\1[0-3]|5\d*:\1[0-4]|6\d*:\1[0-5]|7\d*:\1[0-6]|8\d*:\1[0-7]|9\d*:\1[0-8])" 1;
}

# The `.md` twin a document URL WOULD have, by the llms plugin's naming rule
# (`<dir>/index.md` -> `/<dir>.md`, `<page>.md` -> `/<page>.md`). Whether it
# EXISTS is tested in `server {}` below. Covers the clean URL, its trailing-slash
# form, the explicit `.html` form, and the `<dir>/index.html` an internal `index`
# redirect produces. Anything with an extension (assets, .txt, .md) maps to "".
map $uri $twin_candidate {
  default "";
  "~^/$" /index.md;
  "~^(?<tp>/.+)/index\.html$" $tp.md;
  "~^(?<tp>/.+?)/$" $tp.md;
  "~^(?<tp>/.+)\.html$" $tp.md;
  "~^(?<tp>/(?:[^/.]+/)*[^/.]+)$" $tp.md;
}

# `/a/b/` -> `/a/b` (only for a trailing-slash URI with something before it).
map $uri $slashless {
  default "";
  "~^(?<sl>/.+)/$" $sl;
}

# Per-page discovery on a negotiable HTML response. Empty (= header not sent)
# when the page has no twin, so nothing advertises a URL that does not exist.
map $twin $page_link {
  "" "";
  default '<$twin>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"';
}

# `Vary: Accept` on BOTH sides of a negotiable URL. The HTML side is the one
# implementations forget, and it is the one that matters: without it a shared
# cache stores the HTML and replays it to the next agent that asked for markdown.
map $twin $vary_html {
  "" "";
  default Accept;
}

# A markdown response varies only when it answered a URL that is NOT itself a
# `.md` URL — i.e. it was served by negotiation. `$request_uri` is the ORIGINAL
# request line, untouched by the internal rewrite below.
map $request_uri $vary_md {
  default Accept;
  "~^[^?]*\.md(?:\?|$)" "";
}

# One Cache-Control per content type for `location /`, which serves HTML (clean
# URLs, via try_files), llms*.txt, robots.txt, sitemap.xml and static files.
# "" = no header (images, the webmanifest, …).
map $sent_http_content_type $doc_cache_control {
  default "";
  "~^text/html" "no-cache, must-revalidate";
  "~^text/(?:markdown|plain)" "public, max-age=300, must-revalidate";
  "~^(?:application|text)/xml" "public, max-age=300, must-revalidate";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Relative `Location` on every redirect nginx builds itself — including the
  # directory-slash 301 (`/apps/guide` -> `/apps/guide/`). The origin listens on
  # plain :80 behind the CDN, so an absolute redirect is built as `http://…`:
  # measured live 2026-10-14, `/apps/guide` answered `location:
  # http://developer.civitai.com/apps/guide/` — a scheme downgrade and an extra
  # hop, on a URL an agent is likely to guess.
  absolute_redirect off;


  # 🔴 MACHINE-DISCOVERY ADVERTISEMENT. This site SHIPS its machine-readable
  # artifacts and also ADVERTISES them, which no precedent measured does both of.
  #
  # Measured 2026-09-11 over real, unauthenticated HTTP:
  #   developers.cloudflare.com  SHIPS .well-known/ai-catalog.json (2,088 B,
  #                              application/ai-catalog+json) and
  #                              .well-known/agent-skills/index.json (5,922 B) —
  #                              and its only Link is `rel="service-doc"` -> /api/.
  #                              The catalog it ships is advertised NOWHERE.
  #   mintlify.com/docs          ADVERTISES six rels (llms-txt, llms-full-txt,
  #                              api-catalog, mcp-server-card, agent-card,
  #                              agent-skills).
  #   docs.stripe.com            ADVERTISES one: `rel="service-meta"`.
  #
  # 🔴 ADVERTISING A DEAD TARGET IS WORSE THAN ADVERTISING NOTHING, and this is
  # measured rather than feared: on that same day `docs.mintlify.com` advertised
  # all six rels while EVERY ONE of the six targets returned 530. A Link header
  # is a promise a fetcher acts on with no human ever seeing the result, so
  # `scripts/check-ai-catalog.mjs` parses THIS FILE, fetches every URL named
  # here AND every URL named inside the catalog, and fails on any that is not
  # 200. The ledger it pins is the RELATIONSHIP between the two files; neither
  # one alone can be checked into correctness.
  #
  # 🔴 WHY `Link` IS REPEATED IN EVERY `location` BELOW THAT SETS ANY HEADER,
  # RATHER THAN WRITTEN ONCE AT SERVER LEVEL. nginx inherits `add_header` from an
  # outer block ONLY IF the inner block declares NO `add_header` of its own — one
  # `add_header` in a location silently drops EVERY inherited one.
  #
  # MEASURED, not reasoned: a variant of this file carrying a single server-level
  # `add_header Link` and no per-location copies was run under a real nginx and
  # probed. Four of five document routes came back with NO Link header —
  # `/apps/guide.html`, `/agent-setup/prompt.md`, `/.well-known/ai-catalog.json`
  # and `/` itself — while `/llms.txt` kept it. `/llms.txt` is the control that
  # makes the run readable: it is the one route whose location sets no header of
  # its own, so it proves the server-level directive was present and working
  # while the other four dropped it.
  #
  # 🔴 `/` IS IN THE LOSING SET, WHICH IS THE TRAP INSIDE THE TRAP. The homepage
  # looks like it is served by `location /`, so a reviewer checks `curl -I /`,
  # sees the header and stops. It is not: `index index.html` resolves `/` to
  # `/index.html` through an INTERNAL REDIRECT, which re-runs location matching
  # and lands in `location ~* \.html$` — a block that sets Cache-Control and
  # therefore inherits nothing. A one-URL smoke test of the homepage would have
  # passed on a config that advertises almost nowhere.
  #
  # The duplication is load-bearing, stock nginx cannot factor it out (that needs
  # the third-party headers-more module), and `check-ai-catalog.mjs` asserts the
  # duplication is COMPLETE, so deleting one copy fails loudly instead of
  # half-working.
  #
  # The rel tokens are the de-facto vocabulary measured on mintlify.com, not
  # invented here. `prompt.md` deliberately gets NO rel of its own: it is an
  # ENTRY IN the catalog. That is the one-hop shape this project already commits
  # to on measured grounds — a flat index scored 0.462 against 0.267 for a
  # hierarchy — and a fourth rel would start building the tree.
  set $ai_link '</llms.txt>; rel="llms-txt", </llms-full.txt>; rel="llms-full-txt", </.well-known/ai-catalog.json>; rel="ai-catalog"';

  # Does this document URL have a twin? 🔴 This block must stay BELOW `set
  # $ai_link`: `rewrite … last` stops every later server-level rewrite-module
  # directive, `set` included, so above it the negotiated markdown response went
  # out with an EMPTY Link (measured). Server-level, NOT inside a location: an
  # `if` inside a location that also uses try_files breaks try_files (the
  # documented "if is evil" case). Server-level rewrite directives re-run after
  # every internal redirect (`/apps/guide/` -> `/apps/guide/index.html`), and
  # `$twin_candidate` maps both forms to the same twin, so the answer is stable.
  set $twin "";
  if (-f $document_root$twin_candidate) {
    set $twin $twin_candidate;
  }
  set $negotiate "$prefers_md$twin";
  if ($negotiate ~ ^1/) {
    rewrite ^ $twin last;
  }

  # A HUB PAGE WITH A DIRECTORY OF SUB-PAGES. `/apps/reference/hooks.html` plus
  # `/apps/reference/hooks/<sub>.html` and NO `hooks/index.html`: try_files'
  # `$uri` matches the DIRECTORY for `/apps/reference/hooks/`, the `index`
  # module finds no index.html, and nginx answers 403. Redirect the slash form
  # to the hub instead (relative, permanent). Markdown clients never get here —
  # the negotiation rewrite above already served them the hub's twin. A
  # directory that HAS an index.html (`/apps/guide/`) is left alone.
  set $slash_redirect "";
  if (-f $document_root$slashless.html) {
    set $slash_redirect $slashless;
  }
  if (-f $document_root${uri}index.html) {
    set $slash_redirect "";
  }
  if ($slash_redirect) {
    rewrite ^ /__slash_redirect last;
  }

  # VitePress cleanUrls: /foo/bar → /foo/bar.html
  #
  # Also serves llms.txt / llms-full.txt (root and per-section), robots.txt and
  # sitemap.xml from mime.types; `$doc_cache_control` picks their Cache-Control
  # by content type. `charset utf-8` matters for those text files: llms.txt
  # carries em dashes, and a bare `text/plain` leaves the decoder guessing.
  #
  # The SECOND `add_header Link` is the per-page twin advertisement — a separate
  # field line, which HTTP defines as equivalent to one comma-joined Link value.
  location / {
    charset utf-8;
    add_header Link $ai_link always;
    add_header Link $page_link always;
    add_header Vary $vary_html always;
    add_header Cache-Control $doc_cache_control always;
    try_files $uri $uri.html $uri/ =404;
  }

  # 🔴 THE CATALOG ITSELF. `application/ai-catalog+json` is the type Cloudflare
  # serves for the same filename, and `nosniff` below means nobody gets to
  # re-guess it, so it has to be right at the source.
  #
  # 🔴 `default_type` ALONE DOES NOT SET IT, AND THAT IS THE WHOLE REASON THE
  # EMPTY `types { }` BLOCK IS HERE. `default_type` is the FALLBACK for an
  # extension nginx cannot resolve — it applies to the `.md` routes below
  # precisely because `.md` is absent from nginx's mime.types. `.json` IS in
  # mime.types, so the map wins and `default_type` is never consulted. Measured
  # on a real nginx against this exact file: with `default_type` alone the
  # response came back `content-type: application/json`. An empty `types { }`
  # clears the inherited map for this location, leaving `default_type` as the
  # only source. Deleting the empty block looks like removing a no-op and
  # silently reverts the declared type.
  #
  # `charset_types` is load-bearing for the same reason it is on the .md routes:
  # nginx's default list does not include this type, so `charset utf-8` alone
  # would append nothing.
  #
  # The file is `public/.well-known/ai-catalog.json` in the repo. VitePress
  # copies `public/` into the output verbatim, DOT-DIRECTORIES INCLUDED —
  # measured on this repo's own vitepress version, with a non-dot control file in
  # the same directory to prove the copy ran at all. "A build tool skips
  # dotfiles" is a plausible and common belief, and this entire route is void if
  # it were true here.
  location = /.well-known/ai-catalog.json {
    types { }
    default_type application/ai-catalog+json;
    charset utf-8;
    charset_types application/ai-catalog+json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Link $ai_link always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  # 🔴 THE AGENT-SETUP PROMPT. Exact-match (`=`) so it beats BOTH regex locations
  # below and the cleanUrls `try_files` above — an agent's very first request to
  # this site is this one, and it must not depend on location-matching order.
  #
  # The file is `public/agent-setup/prompt.md` in the repo. VitePress copies
  # `public/` into the output verbatim, so these bytes are the source file's
  # bytes: no markdown pipeline, no HTML, no JS, no redirect. Claude Code does
  # not follow a cross-host redirect — it returns a DESCRIPTION of the redirect
  # instead — so a redirect here breaks every first fetch, silently and in the
  # reassuring direction. Do not "tidy" this into one.
  #
  # nosniff because the whole point is that the declared type is honoured.
  location = /agent-setup/prompt.md {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Link $ai_link always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  # RENAMED PAGES. A page that moved keeps its old URL alive as a permanent
  # redirect to the new one — the clean URL, its `.html` form and the llms
  # plugin's `.md` twin, so a bookmark, a search result and an agent that
  # appends `.md` all land on the page. `$1` carries the suffix across, so the
  # `.md` twin redirects to the `.md` twin rather than to the HTML.
  #
  # This regex must stay ABOVE the `\.md$` and `\.html$` regex locations below:
  # nginx takes the FIRST matching regex, so placed after them the `.md` and
  # `.html` forms would be served (404) by those blocks and never reach here.
  #
  # `absolute_redirect off` makes the Location header relative. The origin
  # listens on plain :80 behind the CDN, so an absolute redirect would be built
  # as `http://<host>/…` — a scheme downgrade and an extra hop for every reader.
  location ~ ^/apps/guide/store-items(\.html|\.md)?$ {
    absolute_redirect off;
    return 301 /apps/guide/sub-listings$1;
  }

  # The Elements gallery was folded into the Component showcase, which demos
  # every element. A `#fragment` never reaches the server and the browser keeps
  # it across a 301 whose Location has none. Eight of the gallery's sixteen
  # anchors exist on the showcase under the same id (`#setup`,
  # `#how-the-elements-behave`, `#menu`, `#navigation`, `#table`,
  # `#civitai-vocabulary`, `#acting-as-the-viewer`, `#contributing`); the other
  # eight were per-category groupings and land at the top of the showcase.
  location ~ ^/apps/elements(\.html|\.md)?$ {
    absolute_redirect off;
    return 301 /apps/showcase$1;
  }

  # llms-plugin markdown exports are named by clean URL (/foo.md), so a section
  # index has no /foo/index.md — resolve that guess to the /foo.md it emits.
  location ~ ^(.+)/index\.md$ {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Link $ai_link always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri $1.md =404;
  }

  # 🔴 .md has no entry in nginx's mime.types, so without a `default_type` here
  # it falls back to application/octet-stream and browsers download it. It used
  # to say text/plain "like GitHub raw"; that is the wrong type and it is not
  # cosmetic. Some agent fetchers bypass lossy summarisation only for
  # `text/markdown` responses under ~100k characters, so every per-page .md this
  # site publishes for machines was being summarised away by the very consumers
  # the llms plugin exists to serve.
  #
  # `charset_types` is load-bearing: nginx's default charset_types list does NOT
  # include text/markdown, so `charset utf-8` alone appends nothing and the
  # header comes back as a bare `text/markdown`.
  #
  # Also the target of the negotiation rewrite at the top of `server {}`, which
  # is why it sends `Vary: Accept` when the ORIGINAL URL was not a `.md` one.
  location ~* \.md$ {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Link $ai_link always;
    add_header Vary $vary_md always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # Target of the hub-page redirect at the top of `server {}`. `internal`, so a
  # direct request is a 404. Advertises like every document route: the hub URL
  # negotiates, so it varies and names its twin too.
  location = /__slash_redirect {
    internal;
    add_header Link $ai_link always;
    add_header Link $page_link always;
    add_header Vary $vary_html always;
    return 301 $slash_redirect$is_args$args;
  }

  # Aggressive cache for fingerprinted assets.
  #
  # 🔴 THE ONE DELIBERATE `Link` EXEMPTION, and it is named as such in
  # `scripts/check-ai-catalog.mjs` rather than left as an omission. Everything
  # under /assets/ is a fingerprinted sub-resource — a JS chunk, a stylesheet, a
  # font — fetched only because a document already referenced it. Nothing
  # discovers this site by fetching one, so the header would be pure per-request
  # overhead on the highest-volume routes. The guard fails if a NEW location
  # appears that is in neither the advertise set nor this exemption, so the
  # decision has to be made explicitly rather than by forgetting.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML pages — short cache, always revalidate.
  #
  # This block matches an EXPLICIT `.html` request only: with cleanUrls, a reader
  # asks for `/apps/guide/` and `location /` serves `/apps/guide.html` through
  # try_files without re-matching locations. Both paths must advertise, so the
  # header is set here too — and this is precisely the block that would have lost
  # it to the inheritance rule, since it already sets Cache-Control.
  #
  # ONE Cache-Control. This block used to carry `expires -1` as well, which emits
  # its own `Cache-Control: no-cache` (plus an `Expires`), so every explicit
  # `.html` response — and `/` itself — sent the header twice.
  location ~* \.html$ {
    charset utf-8;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Link $ai_link always;
    add_header Link $page_link always;
    add_header Vary $vary_html always;
  }

  gzip on;
  gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # 🔴 REQUIRED, not a tuning knob. `text/markdown` is compressible here, so the
  # SAME URL now answers with two different bodies depending on the request's
  # Accept-Encoding. Without `Vary: Accept-Encoding` any shared cache — CDN,
  # corporate proxy, an agent's own HTTP cache — may hand a gzip body to a
  # client that did not ask for one, or an identity body to one that did.
  # Measured before this line: the gzipped /agent-setup/prompt.md response
  # carried `Content-Encoding: gzip` and NO `Vary`. That is on the one route
  # whose entire contract is that the bytes are the source file's bytes.
  gzip_vary on;
}
