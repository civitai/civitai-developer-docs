name: nginx-negotiation

# Serves the BUILT site with the REAL nginx.conf under the runtime image the
# Dockerfile ships (`nginx:alpine`) and asserts the agent-facing HTTP contract:
# Accept negotiation (`text/markdown` q >= `text/html` -> the .md twin, browsers
# and `*/*` -> HTML, no twin -> HTML, never a 404), `Vary: Accept` on both sides
# of a negotiable URL, the per-page `Link` rel="alternate"/"describedby", exactly
# ONE Cache-Control per response, and the content types of the text artifacts.
# See scripts/test-nginx-negotiation.mjs for why only a running nginx can say
# what that config does.
#
# A SEPARATE workflow from build-site on purpose: build-site is a REQUIRED check
# and is kept hermetic (see its header), while this job pulls `nginx:alpine`
# from Docker Hub — a registry outage or rate limit must not block every merge.
# Not a required context; it reports.
#
# RUNS ON EVERY PR, DELIBERATELY UNFILTERED — same reasoning as build-site.yml:
# a path-filtered workflow that later becomes required strands every PR that
# does not touch its paths.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

# LEAST PRIVILEGE: checkout, install, build, run a container on the runner, GET
# loopback URLs. No upload, no deploy, no comment, no push.
permissions:
  contents: read

# Concurrency: one run per ref, newest wins (ported from civitai/civitai#6718 /
# #6728). The org's Actions plan has a fixed concurrent-job limit shared by every
# repo, so a superseded run left going still holds a slot. On a PR `github.ref`
# is `refs/pull/N/merge`, so a new push cancels the run for the old head; the
# check for the NEW head still reports, so a required context is not left
# pending. On `main` it is `refs/heads/main`, so a newer commit cancels the
# older one's run: the newest run checks a tree containing every older commit,
# and intermediate commits show `cancelled` instead of their own verdict. A
# dispatch on a branch shares that ref's group. This job only reads: no deploy,
# push or publish is cut short by a cancel.
concurrency:
  group: nginx-negotiation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx-negotiation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the site
        env:
          APPBLOCKS_SNAPSHOT_ONLY: '1'
        run: npm run build

      - name: Serve dist/ with the real nginx.conf and assert the HTTP contract
        run: npm run test:nginx-negotiation -- --matrix
