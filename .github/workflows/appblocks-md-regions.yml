name: appblocks-md-regions

# PR-BLOCKING: the generated markdown-fallback regions in the App Blocks
# reference pages must match what the generator would write right now.
#
# WHAT THE REGIONS ARE. developer.civitai.com publishes an LLM/scraper channel —
# vitepress-plugin-llms serves every page again as `<path>.md` and aggregates
# them into /llms.txt + /llms-full.txt — and that plugin STRIPS every HTML/Vue
# node from the source markdown. Seven pages render their substance through a Vue
# island reading a build-time JSON artifact, so their payload never reached that
# channel at all: apps/reference/hooks.md was serving 5% of the page's words and
# ZERO of the 33 hooks, under a sentence promising "the signatures below". Each
# page now carries an equivalent static markdown table as SLOT content inside the
# island's tags — invisible to the HTML (these components declare no `<slot />`),
# visible to remark. scripts/appblocks-md.mjs has the full mechanism.
#
# WHY THIS BLOCKS RATHER THAN RUNNING ON THE SCHEDULE. Repo doctrine (see
# appblocks-drift.yml): upstream movement is SCHEDULED, a REPO-LOCAL invariant
# BLOCKS. This is repo-local — the regions render from artifacts this repo
# generates out of its own committed snapshots and pinned devDeps, so it cannot
# false-fail because someone else published something. The same reasoning as
# appblocks-cli.yml and the --offline half of appblocks-snippets.
#
# It is worth blocking on for the same reason the CLI-omission guard is: the
# failure is SILENT. A stale region renders a perfectly healthy-looking page
# while the machine channel serves last month's hooks, and nothing in the build,
# the diff or the browser says so.
#
# The guard has TWO halves, and the structural one is the reason a plain content
# diff is not enough:
#   - CONTENT — every region byte-equals the generator's output.
#   - STRUCTURE — every region still sits inside its island's slot. Measured on a
#     real build: move one region out of the tags and the page renders the static
#     table a SECOND time under the island (2 <table> / 26 <tr>, vs 1 / 13 when
#     in-slot) with every content check still green.
#
# RUNS ON EVERY PR, DELIBERATELY UNFILTERED — do not add a `paths:` filter. Same
# reasoning as appblocks-cli.yml: a path-filtered REQUIRED check leaves any PR
# touching none of the watched files BLOCKED forever waiting on a report that
# never comes. The suite is offline, repo-local and seconds long.
#
# ✅ THIS JOB NOW BLOCKS. `test-md-regions` IS a required status check on `main`:
# measured 2026-10-04 via
# `gh api repos/civitai/civitai-developer-docs/branches/main/protection --jq
# .required_status_checks.contexts` →
# ["test-cli","test-messages","test-bridge","typecheck-snippets","build-site","test-md-regions"]
#
# ⚠️ This comment said the OPPOSITE until 2026-10-04 — that the contexts were
# the first four and that this job "runs and reports on every PR but does not
# gate the merge button". An admin added it at some point after that sentence was
# written, and nothing updates a comment. It was stale in the direction that
# HIDES a gate: a maintainer reading it would believe a red here blocks nothing,
# and could delete or neuter the job on that basis. Branch protection is a
# repo-settings fact no PR can assert, so re-derive it with the command above
# rather than trusting this block.
on:
  pull_request: {}
  workflow_dispatch: {}

# LEAST PRIVILEGE — see appblocks-cli.yml for the full reasoning. This job checks
# out and runs offline node scripts: no upload, no comment, no push, no `gh`
# call. `contents: read` is exactly what actions/checkout needs.
permissions:
  contents: read

jobs:
  test-md-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (pinned SDK devDeps — the regions render from them)
        run: npm ci

      # The JSON artifacts are gitignored, so they must be generated before the
      # guard can render anything. APPBLOCKS_SNAPSHOT_ONLY=1 forces the hermetic
      # committed-snapshot codepath, which is what CI has anyway (no `civitai`
      # sibling checkout) — stating it explicitly means a runner that somehow
      # acquired one still grades the same bytes a contributor's refresh did.
      - name: Generate the App Blocks artifacts (hermetic)
        run: APPBLOCKS_SNAPSHOT_ONLY=1 npm run gen:appblocks

      # Renders every region in memory and diffs it against the committed pages;
      # never writes. Fails with the offending page, the first differing line,
      # and the refresh command.
      - name: Markdown-fallback region drift (content + in-slot structure)
        run: npm run check:md-regions

      # Rides this job rather than getting its own: it needs exactly the two
      # steps above (the pinned devDeps, and hooks.json as the control it grades
      # its own extractor against) and nothing else, so a separate workflow would
      # buy a second `npm ci` and a second required-context negotiation for a
      # sub-second check. Same doctrine as the job it joins — repo-local
      # invariant, therefore blocking: it reads the pinned package and a
      # committed page, so it cannot go red because a third party published
      # something.
      #
      # Different SUBJECT from check:md-regions, deliberately. That one pins a
      # GENERATED region against its generator. This one pins a HAND-WRITTEN
      # table's row set against the package, because the table's value column is
      # a per-hook porting decision that cannot be generated — so it can only be
      # kept complete, never regenerated.
      - name: Porting guide documents every exported hook
        run: npm run check:porting-hooks

      # Rides this job for the same reasons as check:porting-hooks above, and is
      # the same CLASS of guard: a hand-written table's key set pinned against
      # the source it summarises. Repo-local (it reads the pinned devDep's
      # bundled schema through the generator's own resolver, with the committed
      # snapshot as fallback — no network), therefore blocking.
      #
      # It exists because NEITHER check:md-regions above NOR the scheduled
      # check:manifest-parity can see this drift, and both were green while it
      # shipped: `goods.items` properties are one level BELOW anything the
      # generated region expresses, so adding one moves no top-level field and
      # `len(properties)` reads 24 before and after. The key it omitted was
      # `justification`, which the platform validator REQUIRES for an
      # `app_unlock` good — i.e. the documented path to authoring a paid app
      # ended in a submit rejection the reference could not explain.
      - name: goods.items per-entry table documents every schema key
        run: npm run check:goods-item-parity
