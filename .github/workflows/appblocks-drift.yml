name: appblocks-drift

# SCHEDULED, NOT PR-BLOCKING (by design). EVERY guard here detects UPSTREAM
# movement — a re-snapshottable source file changing, the two manifest-schema
# copies diverging, an SDK or civitai/cli release publishing — which is unrelated
# to any given docs PR. Gating unrelated docs PRs on a stale snapshot / a schema
# the docs repo doesn't own would be wrong, so this runs on a schedule (mirroring
# test-samples) + on demand, where a red run is the signal to re-snapshot or
# reconcile. To make any of them a non-blocking informational PR check later,
# add a `pull_request` trigger with `continue-on-error: true`.
#
# 🔴 "VISIBLE SIGNAL" USED TO BE THIS SENTENCE'S CLAIM, AND IT WAS FALSE. A red
# run on a scheduled workflow surfaces nowhere — there is no PR to annotate and
# no reviewer to notify — so a genuine rot failure and a fully-skipped run were
# equally invisible unless a human opened the Actions tab. The `notify` job at
# the bottom of this file is what makes the word "visible" true: it opens (or
# refreshes) ONE GitHub issue naming what rotted, and closes it on the next clean
# run. It also fires when nothing was verified at all, because a silent zero and
# a clean bill of health print the same thing.
#
# The counterpart doctrine: a REPO-LOCAL invariant (no upstream input, so it
# cannot false-fail on someone else's publish) DOES block a PR — see
# appblocks-snippets.yml's --offline half and appblocks-cli.yml.
#
# NAME vs CONTENTS: the `check:spec-drift` step here guards the ORCHESTRATION
# OpenAPI snapshot, not App Blocks, so this file carries one non-App-Blocks
# signal. (It used to be the LAST step, and this note used to identify it that
# way; `check:ds-pins` and `check:example-apps` were appended after it.)
# It lives here rather than in a file of its own because it is the same KIND of
# check under the same doctrine, and a second daily workflow would pay for a
# second checkout + `npm ci` to run one HTTP GET. If a third non-App-Blocks
# drift guard ever arrives, split this into a generically-named `drift` workflow
# — and note that renaming it is free only while it stays schedule-only, since
# nothing can require a context that never runs on a PR.
on:
  schedule:
    # 06:37 UTC daily — just after the test-samples 06:17 run.
    - cron: '37 6 * * *'
  workflow_dispatch: {}

# LEAST PRIVILEGE — see appblocks-cli.yml for the full reasoning. This is the
# one workflow here that hands GITHUB_TOKEN to any step, so it is the one that
# looks like it might need more than read.
#
# 🔴 KEEP THIS LIST IN SYNC WITH THE `env:` BLOCKS AND `permissions:` BLOCKS
# BELOW. It said "one step takes the token" for a while after the second arrived,
# which is exactly the undercount a maintainer auditing token reach would have
# inherited; it then said "it does not [need more than read]" after the notify
# job below started needing `issues: write`, which is the same mistake in the
# other direction. This is the only place the reach is stated in one piece:
#
#   READ-ONLY (`contents: read`), token buys rate-limit headroom and nothing else
#   - check:cli-snapshot   -> api.github.com/repos/civitai/cli/releases/latest
#                             (scripts/check-appblocks-cli-snapshot.mjs)
#   - check:example-apps   -> api.github.com/repos/<owner>/<repo> for each
#                             repository apps/examples.md names, plus
#                             raw.githubusercontent.com/<owner>/<repo>/HEAD/
#                             block.manifest.json for each scope list the page
#                             states (scripts/check-example-apps.mjs). The
#                             manifests are on the RAW host on purpose: the
#                             api.github.com call count stays at one per
#                             repository, so the scope check did not move this
#                             job closer to the unauthenticated 60/hr limit.
#
#   WRITE (`issues: write`), and it is one job, one script, one endpoint family
#   - the `notify` job     -> api.github.com/repos/<this repo>/issues{,/N,/N/comments}
#                             (scripts/drift-notify.mjs)
#
# The read steps are all the SAME shape and the same argument: an
# UNAUTHENTICATED-capable GET of a PUBLIC cross-repo endpoint. A `permissions:`
# block scopes the token against THIS repo only and never gates reads of another
# public repo, and both scripts already degrade to SKIP (never fail) on a 403.
# Every other step reads over unauthenticated HTTPS (raw.githubusercontent.com,
# the npm registry, the prod manifest endpoint) or runs a local `git show`.
#
# 🔴 THE ELEVATION IS JOB-SCOPED, AND THE SPLIT IS THE POINT. The workflow-level
# default stays `contents: read`, so a job added later inherits read; the `drift`
# job — the one that runs `npm ci`, executes every dependency's install scripts
# and talks to seven third-party hosts — PINS `contents: read` explicitly rather
# than inheriting it; and `issues: write` is held only by `notify`, which runs
# ONE node script with no `npm ci` and no third-party code at all. That is the
# same boundary cli-snapshot-refresh.yml draws for the same reason: the
# privileged job should be the one holding nothing worth stealing.
permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned, not inherited: a later edit to the file-level default must not be
    # able to silently elevate the job that runs third-party install scripts.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (pinned SDK devDeps for the SDK-bundled manifest schema)
        run: npm ci

      - name: Snapshot drift — appblocks-snapshots/ vs civitai@origin/main
        run: npm run check:snapshots

      - name: CLI snapshot freshness — civitai-cli-help.txt vs the latest civitai/cli release
        # NOT covered by check:snapshots, and not for lack of trying: that guard
        # diffs a raw upstream FILE, while this snapshot is `--help` OUTPUT
        # captured by running a compiled Go binary — there is nothing to fetch
        # and byte-compare. It probes the snapshot header's recorded binary
        # version against the latest published civitai/cli release instead. (The
        # repo-local half — every advertised `app` subcommand being listed in the
        # generator — blocks a PR from appblocks-cli.yml.)
        if: always()
        env:
          # Lifts the shared-runner rate limit. Absent, a 403 SKIPs, never fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:cli-snapshot

      - name: Manifest schema parity — prod endpoint vs SDK-bundled v1.json
        # Always run so one scheduled run surfaces BOTH drift signals.
        if: always()
        run: npm run check:manifest-parity

      - name: Generation-bridge pin drift — pinned SDK devDeps vs npm latest
        # Always run so a lagging @civitai/app-sdk / blocks-react pin (which
        # silently stales the generated hooks/messages/bridge reference) surfaces
        # on the same scheduled sweep.
        if: always()
        run: npm run check:pins

      - name: OpenAPI spec drift — openapi-snapshots/ vs the published spec
        # The freshness half of the hermetic-build change. `npm run build` now
        # resolves the spec from the COMMITTED snapshot and makes no network
        # request, which is what lets build-site become a required check — the
        # cost is that the published reference only moves when someone
        # re-snapshots. This is the thing that says when: a red run means the
        # orchestrator shipped spec changes the docs have not picked up.
        # Remedy is one command, `npm run copy:spec -- --refresh`, plus a PR.
        # Connectivity failures SKIP (exit 0); only real drift is red.
        if: always()
        run: npm run check:spec-drift

      - name: Design-system pin drift — docs CDN literals vs the declared pin
        # Distinct from check:pins, which never reads prose. These literals are
        # copy-paste CDN URLs, so a stale one hands readers a 404 that renders as
        # an unstyled page with no error.
        if: always()
        run: npm run check:ds-pins

      - name: Example App Block rot — apps/examples.md's repositories vs GitHub
        # The UPSTREAM half of the example-apps guard; the repo-local half
        # (`--offline`: the guard's own fixture tables, the page parsing and
        # still naming >= MIN_EXAMPLE_REPOS repositories, and the page agreeing
        # with its own stated counts and anchors) blocks a PR from
        # example-apps.yml. Note this job runs BOTH halves — the self-test and
        # the page checks run here too, before any request is made.
        #
        # A repository named on that page can be deleted, made private, archived
        # or RENAMED by somebody who has never heard of this repo — textbook
        # upstream movement, so it belongs on this schedule rather than on a PR.
        # The rename case is the reason the guard exists at all: GitHub
        # 301-redirects a renamed repo and the REST API follows it, so a
        # status-code check reports 200 for a link that no longer points where it
        # says. The verdict is computed from the response BODY's `full_name`.
        #
        # It also grades each example's SCOPE list against that repository's own
        # block.manifest.json: a repository can stay public, unrenamed and
        # unarchived while its manifest gains a scope, and the page then tells
        # every reader something false about the privileged surface it declares.
        # Those fetches go to raw.githubusercontent.com, so they add ZERO
        # api.github.com calls — see the token-reach list in the header.
        #
        # `--report` is what makes the `notify` job below possible. Written on
        # EVERY exit path, including a run that verified nothing, because "0
        # verified" and "all clear" are the same exit code and must not be the
        # same signal.
        if: always()
        env:
          # Lifts the shared-runner rate limit. Absent, a 403 SKIPs (loudly),
          # never fails. The repos read are PUBLIC and cross-repo, so this token
          # buys headroom and nothing else.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:example-apps -- --report "$RUNNER_TEMP/example-apps-report.json"

      # The report is the only thing that crosses the job boundary. `warn`, not
      # `error`: a drift job that died before the guard ran produces no report,
      # and that ABSENCE is a signal the notifier acts on — turning it into a
      # failed upload step would replace a deliverable alert with a second red
      # nobody reads.
      - name: Upload the example-apps report for the notifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-apps-report
          path: ${{ runner.temp }}/example-apps-report.json
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # DELIVERY. Every check above DETECTS upstream movement; until this job
  # existed, none of them DELIVERED it. A red run on a scheduled workflow is
  # indistinguishable from nobody looking — cli-snapshot-refresh.yml's header
  # says so in those words, and then that reasoning covered exactly one of the
  # sweep's checks.
  #
  # `if: always()` is load-bearing twice over: the whole point is to react to a
  # `drift` job that FAILED, and equally to one that was SKIPPED or CANCELLED —
  # neither of which renders as red anywhere, and both of which mean nothing was
  # verified. The decision table lives in scripts/drift-notify.mjs, which
  # self-tests on every invocation and is additionally run as a PR-gating step
  # from example-apps.yml; a workflow body is untestable by construction.
  #
  # 🔴 NO `npm ci` IN THIS JOB, DELIBERATELY, AND IT IS A CONSTRAINT ON THE
  # SCRIPT. scripts/drift-notify.mjs imports node:crypto, node:fs and node:url
  # and nothing else; adding a node_modules import breaks this job with
  # MODULE_NOT_FOUND. Two reasons, and the second is the real one: a registry
  # outage must not be what stops an alert going out, and the one job here
  # holding a write scope should execute no third-party code at all.
  notify:
    needs: drift
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The ONE elevation in this workflow, and exactly one scope beyond read:
    #   issues: write — open, update, comment on and close the single tracking
    #                   issue. Nothing else: no contents: write, no
    #                   pull-requests, no packages, no id-token, no actions.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `continue-on-error`, because a MISSING artifact is a signal rather than a
      # failure: it means the drift job died before the guard ran, or was
      # skipped outright, and the notifier's job is to say so. A hard failure
      # here would swallow exactly the case this job exists for.
      - name: Download the example-apps report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: example-apps-report
          path: ${{ runner.temp }}/report

      - name: Open, refresh or close the drift issue
        env:
          DRIFT_NOTIFY_JOB_RESULT: ${{ needs.drift.result }}
          # The job's NAME, for the API lookup that names its failed steps. It
          # sits here rather than defaulted in the script so that this line and
          # the `needs.drift` above it are renamed together.
          DRIFT_NOTIFY_JOB_NAME: drift
          DRIFT_NOTIFY_REPORT: ${{ runner.temp }}/report/example-apps-report.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run notify:drift
