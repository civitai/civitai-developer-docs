name: example-apps

# The PR-side half of the anti-rot guard for `apps/examples.md` — the page that
# names the public example App Block repositories, and the single URL the
# `civitai agent-setup` managed block points an agent at instead of embedding a
# repo list into every scaffolded project.
#
# WHY ONLY HALF RUNS HERE. `scripts/check-example-apps.mjs` asserts two different
# kinds of thing, and this repo's doctrine (see appblocks-drift.yml's header)
# puts them in different places:
#
#   - REPO-LOCAL — the guard's own fixture tables still hold (the parser parses,
#     and the `full_name` comparison still FAILS a rename: the mutation test);
#     the page exists, parses, and still names at least MIN_EXAMPLE_REPOS
#     repositories; and the page does not contradict itself — the counts its
#     prose states match the links on it, and every in-page `#anchor` resolves
#     to a heading that is still there. No upstream input, so none of it can
#     false-fail on somebody else's action. That belongs on a PR, and it is what
#     this job runs, via `--offline`.
#
#   - UPSTREAM — whether each of those repositories still exists, still lives at
#     that owner/repo (GitHub 301-redirects a RENAME, so a status check says
#     200 for a repo that moved), is not archived, and still declares the scopes
#     the page states for it. A rename is unrelated to whatever docs change is in
#     flight, so gating a PR on it would be a permanently-red gate — the thing
#     this repo repeatedly says is worse than no gate at all. That half runs on
#     the daily `appblocks-drift` schedule, which now also DELIVERS its red as a
#     GitHub issue rather than leaving it in a tab nobody opens.
#
# The second step here is the other half of that delivery: the notifier's own
# decision table. It runs nowhere else on a PR, and the branch it exists for is
# the one that is invisible when it breaks — see the step's comment.
#
# RUNS ON EVERY PR, DELIBERATELY UNFILTERED — do not add a `paths:` filter. Same
# reasoning as agent-setup.yml, appblocks-cli.yml and build-site.yml: GitHub does
# not synthesise a passing status for a workflow that never triggers, so a
# path-filtered check that later becomes REQUIRED strands every PR touching none
# of the watched files at mergeStateStatus=BLOCKED forever (measured live on
# #42). The offline half is sub-second and reads one file, so unconditional is
# free.
#
# NOT YET A REQUIRED CONTEXT. Adding it to the branch-protection required checks
# on `main` is a maintainer decision and a separate change; until then this
# reports without blocking.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

# LEAST PRIVILEGE — see appblocks-cli.yml for the full reasoning. This job checks
# out and runs two node scripts, one reading one committed file and one reading
# nothing at all: with `--offline` and `--self-test` there is no network, no
# artifact upload, no PR comment, no push, no `gh` call and — note, since the
# second script's normal mode DOES write GitHub issues — no token of any kind.
permissions:
  contents: read

jobs:
  check-example-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same version as every other job here.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci`: the guard imports node:fs, node:path and node:url and
      # nothing else. Skipping the install keeps the job seconds long and removes
      # the registry as a way for this check to fail for reasons that have
      # nothing to do with the page.
      #
      # 🔴 THAT IS A CONSTRAINT ON THE GUARD, NOT MERELY A NOTE ABOUT IT. Adding
      # any node_modules import to scripts/check-example-apps.mjs breaks this job
      # with MODULE_NOT_FOUND. If an install ever becomes necessary, the offline
      # property above is what you are spending — say so in the same diff.
      - name: the guard self-tests, and apps/examples.md parses and agrees with itself
        run: npm run check:example-apps -- --offline

      # 🔴 THE NOTIFIER'S DECISION TABLE, GATED HERE BECAUSE NOTHING ELSE RUNS
      # IT ON A PR. scripts/drift-notify.mjs decides whether a scheduled sweep
      # opens, refreshes or closes the tracking issue, and it only ever executes
      # on the daily `appblocks-drift` schedule — so a regression in it would
      # merge green and then surface, at the earliest, a day later on a workflow
      # nobody watches, in the form of an alert that did not arrive. The one
      # branch that matters most is the one that cannot be observed at all when
      # it is wrong: a run that verified ZERO repositories must alert, not
      # resolve.
      #
      # `--self-test` makes no decision, reads no environment and opens no
      # socket. It is node-builtins-only for the same reason the step above is.
      - name: the drift notifier's decision table still holds
        run: npm run notify:drift -- --self-test
