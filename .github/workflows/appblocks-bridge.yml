name: appblocks-bridge

# PR-BLOCKING: the generation-BRIDGE reference generator runs at BUILD time
# (prebuild -> gen:appblocks) and HARD-FAILS its coverage guard when the pinned
# @civitai/app-sdk / blocks-react type JSDoc loses a generation-path field
# (sourceImage / additionalResources / imageUrls / cancel) or the parser
# regresses — a plausible-but-wrong artifact that would otherwise surface only in
# the Docker/CI build. This fast unit test reproduces the EXACT coverage relation
# the generator hard-fails on, plus the version-pin classifier, so a PR that bumps
# the SDK pin (or touches the generator) is caught here first.
#
# HERMETIC BY CONSTRUCTION — every step here reads only the checked-out tree and
# the lockfile-pinned `node_modules`. There is deliberately NO pin-FRESHNESS
# check (pin vs npm `latest`) in this job: that is an UPSTREAM-MOVEMENT
# detector, and it lives on the scheduled `appblocks-drift.yml` sweep
# (`npm run check:pins`, same script, same arguments, same exit semantics).
# Do not add it back here. `test-bridge` is REQUIRED on `main` and runs on every
# PR, so a step that fetches npm turns a required context red on EVERY open PR
# at once when someone else publishes @civitai/app-sdk / @civitai/blocks-react —
# a permanently-red gate nobody can act on, which trains everyone to click
# through. Measured, so the claim stays the right size: an ordinary registry
# outage does NOT red it (check-appblocks-pins.mjs degrades unreachable packages
# to a SKIP and exits 0 — verified under `unshare -rn`), and the red paths are a
# LAGGING pin (exit 1, verified against a stub registry serving `latest`
# 99.0.0), a 404/410 on the package itself (exit 1), and an unexpected error
# (exit 2). A publish by someone else is the common one, and it is enough.
# That is the same split appblocks-cli.yml and
# appblocks-snippets.yml already make: repo-local invariants block a PR,
# upstream-movement detectors run scheduled. Note the version-pin CLASSIFIER
# (parseSemver / compareSemver / classifyPin) is still exercised here by
# test:appblocks:bridge — it imports the pure helpers from
# check-appblocks-pins.mjs, whose `main()` is guarded behind an
# `import.meta.url === argv[1]` check and therefore never fetches.
#
# RUNS ON EVERY PR, DELIBERATELY UNFILTERED — do not re-add a `paths:` filter.
# `test-bridge` is a REQUIRED status check on `main`, and GitHub does not
# synthesise a passing status for a workflow that never triggers, so a
# path-filtered required check strands every PR that touches none of the watched
# files at mergeStateStatus=BLOCKED forever. Measured live on #42, which this
# workflow's old filter never saw. See appblocks-cli.yml for the full note; the
# unfiltered trigger is a superset of the paths this file used to watch.
on:
  pull_request: {}
  workflow_dispatch: {}

# LEAST PRIVILEGE — see appblocks-cli.yml for the full reasoning. Checkout +
# npm ci + offline node tests only; no upload, comment, issue, push or API
# mutation. `contents: read` is all actions/checkout requires.
permissions:
  contents: read

jobs:
  test-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (pinned @civitai/app-sdk + @civitai/blocks-react)
        run: npm ci

      - name: Bridge coverage guard + version-pin classifier
        run: npm run test:appblocks:bridge
