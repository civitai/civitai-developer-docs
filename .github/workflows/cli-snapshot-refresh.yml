name: cli-snapshot-refresh

# SELF-HEALING for the one guard whose red nobody sees.
#
# appblocks-snapshots/civitai-cli-help.txt is the ONLY source the published CLI
# reference is generated from (the production image has no `civitai` binary, so
# gen-appblocks-cli.mjs always takes the snapshot path). When it goes stale the
# site silently serves WRONG content — measured on the v0.1.92 re-capture
# (docs#56): `2.0 MB` in 10 places across 8 lines where the CLI says `MiB`.
#
# `check:cli-snapshot` on appblocks-drift.yml already DETECTS that, and detection
# without a remedy is the failure mode: a red run on an unwatched SCHEDULED
# workflow is indistinguishable from nobody looking. This workflow is the remedy
# half: when that check would fail, re-capture the snapshot and OPEN A PULL
# REQUEST carrying it.
#
# 🔴 THE POLICY THIS ENFORCES: THE SNAPSHOT TRACKS THE LATEST *RELEASE*, NOT
# `main`'s TIP.
#
#   THE REASON. developer.civitai.com documents the binary a reader can actually
#   install — `brew install civitai`, `npm i -g @civitai/cli`, a GitHub release
#   archive. All three are RELEASES. Capturing from civitai/cli's `main` would
#   publish help text for flags and commands no user can obtain, on a site whose
#   whole job is to describe the tool in the reader's hands.
#
#   THE TRIGGER FOLLOWS FROM IT. Tag-lag is therefore the correct AND sufficient
#   signal — there is no between-release build a reader could be holding for the
#   docs to be wrong about — so `decideAction` compares the snapshot header's tag
#   against the latest published release and nothing else.
#
#   THE CONSEQUENCE, STATED SO IT IS NOT READ AS A BUG. Drift on civitai/cli's
#   `main` between releases is DELIBERATELY INVISIBLE to this workflow.
#   `commitsSinceSnapshot` (docs#53, added for exactly that blind spot) is not
#   consulted here, on purpose. This was never written down, and its absence
#   produced a concrete error: the PR introducing this workflow claimed it would
#   have fired for the hand re-captures docs#48 and docs#52. It would have fired
#   for NEITHER — both happened while the snapshot's tag was unchanged and
#   check:cli-snapshot was green. Under this policy those two were re-captures of
#   UNRELEASED `main` state, i.e. the thing that should not have happened, rather
#   than incidents this missed. docs#56 (v0.1.90-34 -> v0.1.92, a real release)
#   is the shape this fires for.
#
#   CHANGING IT IS A POLICY DECISION, NOT A TRIGGER SWAP. Capturing `main` means
#   a docs PR per civitai/cli merge, a snapshot header that stops naming an
#   installable version, and a published reference describing a binary nobody
#   has. Decide that on its merits; do not arrive at it by "fixing" this trigger.
#
# NOT A GATE, DELIBERATELY. A civitai/cli release is UPSTREAM movement, unrelated
# to any given docs PR — the same doctrine that keeps every check in
# appblocks-drift.yml off the PR path (read its header). Do NOT add this job to
# the required contexts on `main`, and do NOT add a `pull_request:` trigger. (The
# TESTS for the refresher are a different thing entirely: they are repo-local and
# offline, so they DO block a PR — see cli-snapshot-refresh-test.yml.)
#
# 🔴 IT OPENS A PR; IT NEVER PUSHES TO `main`. The human read of that diff is the
# product: the MB→MiB change was only legible as a real user-facing fix rather
# than snapshot churn because somebody looked at it. A bot committing to main
# turns a review into a notification.
#
# 🔴 PREREQUISITE — AN *ORGANIZATION* POLICY. IT IS NOT A REPOSITORY SETTING, AND
# NOBODY WITH ADMIN ON THIS REPO CAN FLIP IT. The push works; `gh pr create` with
# GITHUB_TOKEN is refused with "GitHub Actions is not permitted to create or
# approve pull requests (createPullRequest)".
#
# 🔴 THIS PARAGRAPH USED TO SAY "ONE REPO SETTING, CURRENTLY OFF" AND SEND THE
# READER TO Settings -> Actions -> General -> Workflow permissions. THAT WAS
# WRONG, AND BEING WRONG IN THE ACTIONABLE-LOOKING DIRECTION IS WHY IT SURVIVED:
# it reads as a one-tick chore somebody will get to. What is measurable from this
# repository, re-measured 2026-09-25:
#
#   gh api repos/civitai/civitai-developer-docs/actions/permissions/workflow
#     -> {"default_workflow_permissions":"write",
#         "can_approve_pull_request_reviews":false}
#
# `default_workflow_permissions` is ALREADY `write` — the half of that old advice
# a maintainer could act on had in fact been done, which the old text gave no way
# to notice. The remaining flag is held false by the ORGANIZATION's Actions
# policy: the corresponding `-X PUT … -F can_approve_pull_request_reviews=true`
# is rejected with a 409 naming the org, so the repository toggle cannot be
# turned on from here at all. An org owner changing `civitai`'s Actions policy is
# the only thing that clears it.
#
# DO NOT add a step that attempts that PUT, and do not re-word this back into a
# repository-settings instruction. An instruction the reader cannot carry out is
# worse than no instruction: it reads as an open action item forever.
#
# 🔴 SO THE RED IS CURRENTLY PERMANENT AND NOBODY CAN ACT ON IT — 11 consecutive
# failed scheduled runs, 2026-09-15 .. 2026-09-25, last green 2026-09-14. `decide`
# and the binary-supplying job succeed every time; `refresh` captures cleanly, pushes
# `bot/cli-snapshot-refresh`, and then exits 1 on the refusal. The snapshot is
# never lost — only the announcement is. (This used to add "currently carrying
# v0.1.106". Re-measured 2026-09-25: `git ls-remote --heads origin` lists 20
# branches and NONE of them is `bot/cli-snapshot-refresh`, so the next run
# CREATES it rather than continuing one.)
#
# That was correct reasoning from a premise that turned out to be false: "exit
# red until somebody ticks the box" assumed a box somebody could tick. A
# permanently red gate trains everyone to click through, so this needs to become
# "push the branch, raise ONE tracking issue, exit 0" — with the issue closed
# automatically on the first run that gets all the way through, so it cannot
# become green-and-silent either.
#
# 🔴 THAT FIX CANNOT BE WRITTEN ENTIRELY IN THIS DIRECTORY, AND THE BLOCKER IS
# MEASURED, NOT ASSUMED. Raising the issue needs `issues: write` on a job here,
# and two assertions in scripts/test-refresh-cli-snapshot.mjs refuse it — both by
# grepping this file's RAW TEXT rather than its structure:
#   - "write permissions are scoped to the ONE job" bans the substring `issues:`
#     anywhere after `\njobs:`, so it fails on the permissions block AND on any
#     comment that mentions the scope;
#   - "the expensive jobs are GATED on the freshness decision" requires EVERY
#     non-`decide` job to carry `if: needs.decide.outputs.action == 'refresh'`,
#     which a notifier that must also report when the verdict is `up-to-date`
#     cannot satisfy by construction.
# Both need widening from "the whole jobs block" to "the writer job" before the
# notifier can land. Neither is a real security property being relaxed.
#
# A COMPANION WORKFLOW READING THIS RUN OVER THE API DOES NOT WORK EITHER — also
# measured. `continue-on-error: true` rewrites the conclusion the REST jobs
# endpoint reports: on run 36136462522 the freshness step exited 1
# (`##[error]Process completed with exit code 1` in the log) while
# /actions/runs/36136462522/jobs reported that same step as
# `"conclusion": "success"`. So a cross-run reader cannot see the one signal it
# would need, and the notifier has to live in THIS file.
#
# 🔴 THE PR'S CHECKS DO NOT RUN. A pull request opened by GITHUB_TOKEN does not
# get its checks run — GitHub suppresses it to prevent recursion. Measured with
# a discriminating control: two PRs carrying the same kind of diff into the same
# repo, differing only in who opened them. The bot PR reported a
# `statusCheckRollup` of 0 entries and `gh pr checks` printed "no checks
# reported" (its seven pull_request runs existed only as
# `conclusion=action_required` and never started); the human PR reported 7, all
# in_progress. So state the OBSERVABLE — the PR shows ZERO checks — which reads
# as "nothing to worry about" on exactly the PR whose content nobody has
# verified; `main`'s six required contexts never report either, so it cannot
# reach a mergeable state on its own. There is no PAT secret in this repo (measured:
# `gh api repos/civitai/civitai-developer-docs/actions/secrets` -> total_count 0)
# and creating one is a maintainer decision, so the mitigation is DISCLOSURE: the
# PR body says it in its first section, with the two one-click remedies (close +
# reopen, or push an empty commit). If a PAT is ever added, pass it to the `gh`
# step as GH_TOKEN and delete that section from `prBody` — a stale warning is
# worse than none.
#
# 🔴 AND THE EMPTY "TRIGGER CHECKS" COMMIT THAT REMEDY ASKS FOR USED TO BE
# DELETED BY THE NEXT RUN. The refresher force-pushed a branch rebuilt from
# `main`, so a reviewer who followed the PR body's own instructions lost their
# commit — and their checks with it — on the next cron tick, silently. The script
# now EXTENDS `bot/cli-snapshot-refresh` instead of recreating it. Do not
# reintroduce `--force` there.
#
# THE LOGIC LIVES IN scripts/refresh-cli-snapshot.mjs, not here. A workflow body
# is untestable by construction; that script is covered by
# scripts/test-refresh-cli-snapshot.mjs, which runs on every PR from
# cli-snapshot-refresh-test.yml.
on:
  schedule:
    # 07:07 UTC daily — 30 minutes after the appblocks-drift sweep at 06:37, so
    # the human-facing red and the remedy PR do not race for the same answer.
    - cron: '7 7 * * *'
  workflow_dispatch:
    inputs:
      force_tag:
        description: >-
          Force a re-capture at this civitai/cli tag, bypassing the freshness
          verdict (e.g. v0.1.92). Leave empty for the normal path. This is how
          the drift path gets exercised while the committed snapshot is current.
        required: false
        default: ''

# 🔴 ONE RUN AT A TIME. The cron tick and a manual dispatch (or a re-run of
# either) can overlap, and both would pass the `gh pr list --state open` check
# before either created anything — then collide on `gh pr create`. The loser's
# "a pull request already exists" is NOT the blocked-setting message, so it took
# the generic path: exit non-zero with the branch already pushed. Serialised
# instead. `cancel-in-progress: false` is the load-bearing half: cancelling a run
# that has already pushed the branch would leave exactly the "pushed, nobody
# told" state this workflow exists to end.
concurrency:
  group: cli-snapshot-refresh
  cancel-in-progress: false

# LEAST PRIVILEGE, and the elevation is JOB-SCOPED on purpose. The repo default
# is `write` (measured 2026-08-06 via the actions/permissions/workflow API) which
# every workflow here overrides down to `contents: read`; this file keeps that
# default so any job ADDED later inherits read, and the one job that genuinely
# needs more asks for it itself.
#
# 🔴 THE `refresh` JOB BELOW USED TO BE DESCRIBED AS "THE ONLY ELEVATION IN THIS
# REPO". THAT IS NO LONGER TRUE, AND A COMMENT UNDERCOUNTING WHERE WRITE LIVES IS
# EXACTLY WHAT A MAINTAINER AUDITING TOKEN REACH WOULD INHERIT. There are two,
# they are disjoint in job and in scope, and both follow the same rule — the
# privileged job runs no third-party code it did not have to:
#   - this file's `refresh` job   -> contents + pull-requests (push a branch, open a PR)
#   - appblocks-drift.yml `notify` -> the issues scope, to deliver the scheduled
#                                     sweep's red as a tracking issue. That job
#                                     runs one node script, no `npm ci`.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. ASK THE QUESTION FIRST, CHEAPLY.
  #
  # A Go toolchain and a full upstream `make build` used to run
  # UNCONDITIONALLY, including on the ~364 days a year when the answer is
  # "nothing to do" — the freshness decision was not made until the last step.
  # (The build is gone; the ~20 MB release download that replaced it is gated the
  # same way, and the gating is what this job is for.)
  # appblocks-drift.yml's header reasons explicitly about exactly this cost for
  # its own checks; this job is that reasoning applied here.
  #
  # It also RESOLVES THE RELEASE TAG ONCE. The tag used to be resolved twice —
  # a `curl` here and the script's own fetch later — which can return two
  # different answers if a release publishes in between, and the observable of
  # that disagreement is a `WRONG BINARY` refusal blaming the capture for a race.
  # The answer is passed forward as CLI_SNAPSHOT_REFRESH_LATEST_TAG. That `curl`
  # was also UNAUTHENTICATED under `set -euo pipefail`, so a shared-runner rate
  # limit (60/hr) killed the job outright — turning a condition whose whole
  # contract is "never fail, just skip" into a red run.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.verdict.outputs.action }}
      tag: ${{ steps.verdict.outputs.tag }}
      latest: ${{ steps.verdict.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # The freshness verdict, standalone and non-fatal. `check:cli-snapshot`
      # exits 1 on drift, which is the SIGNAL this workflow acts on rather than
      # a failure of it — so it is captured, echoed into the run log for the
      # human reading it, and never allowed to fail the job. The refresher makes
      # its own decision below from the same inputs; this step exists so the run
      # log says WHY in the guard's own words.
      - name: Freshness verdict (informational — never fails this job)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:cli-snapshot

      - name: Decide whether a re-capture is needed
        id: verdict
        env:
          # Lifts the 60/hr unauthenticated rate limit on the releases GET. The
          # script SKIPs rather than failing if the read does not come back.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_SNAPSHOT_REFRESH_TAG: ${{ github.event.inputs.force_tag }}
        run: node scripts/refresh-cli-snapshot.mjs --decide

  # ---------------------------------------------------------------------------
  # 2. OBTAIN THE BINARY THE DOCS DESCRIBE — THE PUBLISHED RELEASE ASSET — IN A
  # JOB THAT HOLDS NOTHING WORTH STEALING.
  #
  # 🔴 THIS JOB USED TO BUILD civitai/cli FROM SOURCE, AND THAT MADE THE GATE
  # PERMANENTLY RED. `check:cli-snapshot` compares the committed snapshot
  # byte-for-byte against a capture from the PUBLISHED RELEASE ASSET; this job
  # produced the committed snapshot with `make build` at the tag. The two stamp
  # the header's version line differently and always will — `make build` derives
  # it from `git describe` (`Binary version: civitai v0.1.109`), goreleaser's
  # release ldflags stamp the bare version (`Binary version: civitai 0.1.109`).
  # Measured 2026-09-25 on `main`: 163282 vs 163281 bytes, 116 `===CMD` blocks on
  # BOTH sides, ONE differing line — line 3 — by ONE character. Each half was
  # correct alone and together they could never agree, so the daily sweep was red
  # forever, which is the state that trains everyone to click through a gate.
  #
  # THE FIX IS ONE SOURCE OF TRUTH: both halves now read the SAME artifact, so
  # the committed snapshot literally IS "what the release emits", which is what
  # the gate claims. Do NOT close it the other way round — normalising the
  # version line inside the gate, or overriding upstream's ldflags here — both of
  # those re-introduce a snapshot describing a binary nobody can install, and
  # they put the rule in two places again.
  #
  # `go install` had been ruled out here because it sets no ldflags and stamps
  # "dev"; that reasoning is superseded rather than forgotten — nothing is built
  # at all now, and the version in the header is the one the RELEASE stamped.
  #
  # 🔴 NOTHING REMOTE REACHES A PATH THIS JOB MAKES EXECUTABLE. The asset name is
  # derived from `$TAG` AFTER a plain-version shape gate, never from the name the
  # releases API hands back, and the verified bytes are installed at a CONSTANT
  # path before the executable bit is set. sha256 verification does NOT close
  # that hole by itself — the same endpoint serves the tag and the checksums —
  # and getting it wrong shipped a critical `js/command-line-injection` alert on
  # docs#101. The same discipline, at length and with the incident, is in
  # scripts/check-appblocks-cli-snapshot.mjs (`resolveReleaseBinary`,
  # `isPlainVersionTag`): read it before editing the block below.
  #
  # 🔴 THE JOB SPLIT NARROWS A REAL EXPOSURE — AND IT DOES NOT CLOSE IT. STATE
  # BOTH, because an earlier version of this comment claimed the boundary was
  # complete and it is not.
  #
  # When upstream code ran inside the job holding `contents: write` +
  # `pull-requests: write`, with actions/checkout's default
  # `persist-credentials: true` having written this repo's token into
  # `.git/config`, anyone able to move a tag in civitai/cli could read that
  # credential directly out of the checkout. Two things hold that shut:
  #   - this job declares `contents: read`, so the token IT can reach is
  #     read-only for this repo;
  #   - it does not check this repository out AT ALL, so there is no
  #     `.git/config` holding a credential for upstream code to read. That is
  #     also why the download below is plain `gh` + `sha256sum` rather than a
  #     node script sharing the guard's helpers: reusing them would mean
  #     checking this repo out here, which re-opens exactly that.
  # Keep both.
  #
  # 🔴 WHAT IT DOES NOT BUY: THE UPSTREAM *BINARY* STILL RUNS WITH WRITE. The
  # `refresh` job below downloads this job's artifact, `chmod +x`es it and
  # EXECUTES it (the capture shells out to it per command) while holding
  # `contents: write` + `pull-requests: write` and a `persist-credentials: true`
  # checkout of this repo. Moving from a source build to a release asset narrows
  # WHO can put code there — it takes publishing a release rather than moving a
  # tag — and removes upstream's BUILD-TIME code (Makefile recipes, go generate,
  # dependency resolution) from this job entirely. It does not stop the resulting
  # binary reaching this repo's write token. Nor is the asset SIGNED: the sha256
  # below proves the bytes match what that release's own checksums.txt says, and
  # the same endpoint serves both, so it is an integrity check on the download
  # and not a statement about who produced it. Do not describe this as "the token
  # is no longer reachable from upstream code" — it is reachable, by a longer
  # route.
  #
  # Closing it properly is a separate, deliberate change, not a tightening to
  # slip in here: either `persist-credentials: false` on the refresh checkout
  # (plus an explicit credential for the one push), or a THIRD unprivileged job
  # that runs the binary and uploads the captured bytes, leaving the privileged
  # job to commit an artifact it never executed. Both are real designs with
  # their own failure modes; neither is in this PR.
  fetch-cli:
    needs: decide
    if: needs.decide.outputs.action == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # 🔴 THE TAG RIDES IN `env:`, NEVER INTERPOLATED INTO THE SHELL. A
      # `${{ … }}` expansion is substituted into the script TEXT before bash sees
      # it, so a tag containing shell metacharacters would be executed rather
      # than compared. `"$TAG"` is a value; `${{ … }}` is code.
      - name: Download and verify the civitai CLI release asset
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "the decide job named no tag — refusing to fetch an unspecified version" >&2; exit 1
          fi
          # The shape gate, mirroring isPlainVersionTag() in
          # scripts/check-appblocks-cli-snapshot.mjs: no path separators, no
          # `..`, no whitespace, no shell metacharacters, bounded length. It runs
          # BEFORE the tag is used for anything, because everything below
          # interpolates it.
          #
          # 🔴 `-z` IS LOAD-BEARING, NOT DECORATION. Without it grep anchors
          # per LINE, so a tag_name of "v0.1.109\nv0.1.108" matches on its first
          # line and walks straight through a gate whose whole job is to reject
          # anything that is not one plain version. Measured 2026-09-25: plain
          # `grep -qE` accepted it, `grep -qzE` (one NUL-terminated record, so
          # the newline is ordinary data and `$` is the end of the STRING)
          # rejects it — which is also what the JavaScript regex it mirrors does,
          # since JS `$` without the `m` flag anchors at end-of-input.
          if [ "${#TAG}" -gt 64 ] || ! printf '%s' "${TAG}" | grep -qzE '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "refusing a tag_name that is not a plain version: ${TAG}" >&2; exit 1
          fi
          BARE="${TAG#v}"
          ASSET="civitai_${BARE}_linux_amd64"
          DL="${RUNNER_TEMP}/cli-release"
          OUT="${RUNNER_TEMP}/cli-bin"
          mkdir -p "${DL}" "${OUT}"
          gh release download "${TAG}" --repo civitai/cli --dir "${DL}" \
            --pattern "${ASSET}" --pattern checksums.txt
          # The digest is re-validated AT THE USE SITE as 64 hex and nothing
          # else. An empty or malformed line here means the release layout moved;
          # refuse rather than run an unverified binary.
          EXPECTED="$(awk -v f="${ASSET}" '$2 == f || $2 == "*" f { print $1 }' "${DL}/checksums.txt")"
          if ! printf '%s' "${EXPECTED}" | grep -qE '^[0-9a-f]{64}$'; then
            echo "checksums.txt for ${TAG} carries no sha256 line for ${ASSET}" >&2; exit 1
          fi
          echo "${EXPECTED}  ${DL}/${ASSET}" | sha256sum -c -
          # Only NOW does anything become executable, and at a constant path
          # built from no remote string at all.
          install -m 0755 "${DL}/${ASSET}" "${OUT}/civitai"
          # Positive control on the asset itself: a binary whose --version does
          # not name the tag would poison the snapshot header, and the refresher
          # would (correctly) refuse it later — fail here instead, where the
          # message is about the download rather than about the capture. It is
          # compared BARE, because that is what the release ldflags stamp.
          "${OUT}/civitai" --version
          "${OUT}/civitai" --version | grep -qxF "civitai ${BARE}"

      - uses: actions/upload-artifact@v4
        with:
          name: civitai-cli-bin
          path: ${{ runner.temp }}/cli-bin/civitai
          retention-days: 1
          # A silently absent artifact would reach the next job as "no binary",
          # which the refresher refuses anyway — but it refuses with a message
          # about CIVITAI_CLI_BIN rather than about a download that produced
          # nothing. Fail where the cause is.
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. CAPTURE, AND OPEN THE PR. The only job that holds write scopes, and it
  # runs no upstream code: it consumes the binary as an artifact.
  #
  # Exits 0 and does NOTHING when the snapshot turns out to be current after
  # all; exits NON-ZERO with no branch and no PR when the capture is short,
  # carries NUL bytes, or came from the wrong binary.
  refresh:
    needs: [decide, fetch-cli]
    if: needs.decide.outputs.action == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The only elevation in THIS workflow, and exactly two scopes:
    #   contents: write       — push the stable `bot/cli-snapshot-refresh` branch.
    #                           (`main` is protected and is never a push target.)
    #   pull-requests: write  — create the PR, or update the existing one in place.
    # Nothing else: no issues, no packages, no id-token, no actions. The job
    # checks out, runs node, pushes ONE branch and opens ONE PR.
    #
    # This block used to be described as the only elevation in the whole repo;
    # it is not any more. The corrected statement is in this file's header — it
    # is a cross-workflow fact, and it also cannot be written here, because
    # test-refresh-cli-snapshot.mjs greps the raw `jobs:` text (comments
    # included) for scope names this job must not request.
    # scripts/test-refresh-cli-snapshot.mjs asserts this block stays this shape —
    # both that the two scopes are present here and that NO OTHER JOB in this
    # file holds write.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 🔴 FULL HISTORY, DELIBERATELY. actions/checkout defaults to
      # `fetch-depth: 1` — a SHALLOW clone. That was survivable while this job
      # recreated the branch and force-pushed, and it is not the shape it has
      # now: the run fetches `bot/cli-snapshot-refresh`, checks it out and
      # commits ON TOP, so the new commit's parent sits at a shallow boundary
      # and the push is a fast-forward of a ref whose history the local repo
      # does not hold. That combination is where "attempt to push a shallow
      # repository" lives.
      #
      # Stated as a HAZARD AVOIDED, not a bug observed: the shallow push has not
      # been reproduced, and the offline suite clones fully so it cannot see the
      # difference either way. `fetch-depth: 0` removes the question for the
      # cost of a full clone of a docs repo — cheap, and better than discovering
      # it on a cron run nobody is watching.
      #
      # 🔴 AND IT IS NOW LOAD-BEARING FOR A SECOND, HARDER REASON: the run MERGES
      # the base branch into the bot branch before capturing (see `syncWithBase`
      # — without it, the first ACCEPTED bot PR leaves every later one
      # conflicted), and a merge needs a common ancestor. A shallow clone does
      # not have one. This is no longer only about the push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: civitai-cli-bin
          path: ${{ runner.temp }}/cli-bin

      # upload-artifact does not preserve the executable bit.
      - name: Make the binary executable
        run: chmod +x "${RUNNER_TEMP}/cli-bin/civitai"

      - name: Re-capture and open/update the PR
        env:
          CIVITAI_CLI_BIN: ${{ runner.temp }}/cli-bin/civitai
          CLI_SNAPSHOT_REFRESH_TAG: ${{ github.event.inputs.force_tag }}
          # The release tag `decide` already resolved — classified normally, not
          # forced. See the decide job: resolving it twice can disagree.
          CLI_SNAPSHOT_REFRESH_LATEST_TAG: ${{ needs.decide.outputs.latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-cli-snapshot.mjs
