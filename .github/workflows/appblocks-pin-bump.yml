name: appblocks-pin-bump

# THE REMEDY FOR A LAGGING @civitai/* PIN.
#
# appblocks-drift.yml's check:pins / check:ds-pins DETECT a pinned devDep that
# trails npm latest. This workflow bumps it: scripts/bump-appblocks-pins.mjs
# moves the pins, the lockfile and the hand-written `@civitai/<pkg>@x.y.z`
# literals to npm latest, regenerates the reference pages, and opens or updates
# ONE pull request on `bot/appblocks-pin-bump`. It never pushes to `main`.
#
# The PR auto-merges (squash) once `main`'s required checks pass, but ONLY when
# the change is version strings alone and every tracked pin lands exactly at npm
# latest. If the regenerated pages changed beyond their version strings, the PR
# gets the `content-change` label and waits for a human. The logic and its
# tests live in the script (scripts/test-bump-appblocks-pins.mjs); this file is
# a thin caller.
#
# CHECKS (#148). A PR pushed or opened with the default GITHUB_TOKEN gets no
# `pull_request` runs (GitHub holds them at `action_required`), and `main`'s
# branch protection counts only the required contexts from `pull_request` runs:
# dispatching the workflows instead was tried and did not satisfy it (docs#339).
# So `publish` pushes, opens the PR, labels it and enables auto-merge with a
# GitHub App installation token (repo variable AGENT_APP_CLIENT_ID, secret
# AGENT_APP_PRIVATE_KEY), minted in that job and scoped to this repository.
# Its pushes start the ordinary `pull_request` runs.
#
# PRIVILEGE. Two jobs. `prepare` holds read scopes only and no app token, runs
# `npm ci` / `npm install` and the generators, and hands a git bundle to
# `publish`, which mints the app token, installs nothing, recomputes the diff
# and the auto-merge decision itself, and refuses to push a bundle that changes
# any path the bot does not own (scripts/lib/bot-push-guard.mjs): its push
# starts the PR's pull_request workflows, which run the branch's own scripts.
#
# Auto-merge is enabled by the app, so the merge is made as the app and DOES
# start `push` workflows on `main`, like a human merge. Nothing deploys from
# GitHub Actions: the site is deployed from `main` by the build pipeline.
on:
  schedule:
    # 07:17 UTC daily, after the appblocks-drift sweep (06:37) and the CLI
    # snapshot refresher (07:07).
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only. Reads npm and prints the bump; no install, no git, no PR.
        type: boolean
        default: false
      rehearse_from:
        description: >-
          Rehearsal. @civitai/<pkg>@<lower version>: pin it down first, then bump it
          back to npm latest, so the whole path runs while the net diff stays empty.
        required: false
        default: ''
  # For a publisher to call after an npm release, e.g.
  #   gh api repos/civitai/civitai-developer-docs/dispatches -f event_type=appblocks-sdk-published
  repository_dispatch:
    types: [appblocks-sdk-published]

# One run at a time. cancel-in-progress stays false: cancelling a run that has
# already pushed the branch would leave a branch with no PR update.
concurrency:
  group: appblocks-pin-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.prepare.outputs.action }}
    steps:
      # Full history: the bot branch is extended by merging `main` into it.
      # No persisted credential: this job runs third-party install code, and
      # the repo is public, so fetching needs none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Plan only (dry run)
        if: ${{ inputs.dry_run }}
        env:
          REHEARSE_FROM: ${{ inputs.rehearse_from }}
        run: node scripts/bump-appblocks-pins.mjs --dry-run

      - name: Bump, regenerate and commit on the bot branch
        id: prepare
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSE_FROM: ${{ inputs.rehearse_from }}
          OUT: ${{ runner.temp }}/pin-bump
        run: node scripts/bump-appblocks-pins.mjs --prepare --out "$OUT"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.prepare.outputs.action == 'publish' }}
        with:
          name: pin-bump
          path: ${{ runner.temp }}/pin-bump
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: prepare
    if: ${{ needs.prepare.outputs.action == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The writes are the app token's, not GITHUB_TOKEN's, so this job's own
    # GITHUB_TOKEN stays read-only. The token gets exactly:
    #   contents: write       push bot/appblocks-pin-bump; enable auto-merge
    #   pull-requests: write  open/update the PR, enable auto-merge
    #   issues: write         create the `content-change` label (labels are an
    #                         issues resource)
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: civitai
          repositories: civitai-developer-docs
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # The persisted credential is the app token, so the script's `git push`
      # is made as the app and starts the PR's `pull_request` runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: pin-bump
          path: ${{ runner.temp }}/pin-bump

      - name: Push, open or update the PR, set auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IN: ${{ runner.temp }}/pin-bump
        run: node scripts/bump-appblocks-pins.mjs --publish --in "$IN"
