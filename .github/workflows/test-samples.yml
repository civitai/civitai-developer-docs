name: test-samples

on:
  pull_request:
    paths:
      - 'site/**/*.md'
      - 'orchestration/recipes/**/*.md'
      - 'scripts/test-doc-samples.mjs'
      - 'package.json'
      - '.github/workflows/test-samples.yml'
  schedule:
    # 06:17 UTC daily — catches API-side drift even when docs don't change.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      section:
        description: 'Which section to test'
        type: choice
        options: [all, site, orch]
        default: all

# LEAST PRIVILEGE — see appblocks-cli.yml for the full reasoning. Checkout +
# node doc-sample runner only; no upload, comment, issue, push or API mutation.
# The CIVITAI_TOKEN below is a repository SECRET, not the GITHUB_TOKEN — secret
# availability is unaffected by this block, so pinning to read does not disturb
# the authenticated sample runs.
permissions:
  contents: read

# Cancel superseded PR runs only (see civitai/civitai-developer-docs#252). Push, schedule
# and dispatch runs each get their own group, so none is ever cancelled or displaced.
concurrency:
  group: test-samples-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 🔴 NO SECRET FOR A BOT BRANCH'S PR. The two bots (cli-snapshot-refresh.yml,
# appblocks-pin-bump.yml) push `bot/*` branches with a GitHub App token, so their
# PRs DO start this workflow (#148) — and their content was built by a job that
# ran `npm ci` / an upstream binary. The doc pages this runs can point a sample
# at any host with `auth="true"`, and `<script setup>` runs in `vm`, which is not
# a sandbox. So a `bot/*` PR runs the samples in `test-samples-bot`, which never
# references CIVITAI_TOKEN (a secret referenced anywhere in a job reaches that
# job's runner), and `test-samples` skips it. Authenticated samples on a bot PR
# therefore SKIP; the daily schedule still runs them authenticated on `main`.
jobs:
  test-samples:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'bot/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        section: [site, orch]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select section
        id: filter
        run: |
          input="${{ github.event.inputs.section }}"
          if [ -n "$input" ] && [ "$input" != "all" ] && [ "$input" != "${{ matrix.section }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Run ${{ matrix.section }} samples
        if: steps.filter.outputs.skip != 'true'
        env:
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
        run: node scripts/test-doc-samples.mjs --${{ matrix.section }}

  test-samples-bot:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bot/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        section: [site, orch]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ${{ matrix.section }} samples (unauthenticated)
        run: node scripts/test-doc-samples.mjs --${{ matrix.section }}
