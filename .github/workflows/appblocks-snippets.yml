name: appblocks-snippets

# PR-BLOCKING: a doc snippet that drifts from the pinned SDK (a renamed hook, a
# wrong return shape, a bad call signature) must block the docs PR that carries
# it. Runs on EVERY pull request.
#
# RUNS ON EVERY PR, DELIBERATELY UNFILTERED — do not re-add a `paths:` filter.
# `typecheck-snippets` is a REQUIRED status check on `main`, and GitHub does not
# synthesise a passing status for a workflow that never triggers, so a
# path-filtered required check strands every PR touching none of the watched
# files at mergeStateStatus=BLOCKED forever, waiting on a report that will never
# come — measured live on #42. See appblocks-cli.yml for the full note.
#
# It also retires a maintenance hazard this file used to carry: the old filter
# had to be kept in sync by hand with the doc roots the pin-guard actually scans
# (DOC_ROOTS / DOC_FILES in check-design-system-pins.mjs), because a root the
# guard reads but the trigger did not watch merged its stale literals green.
# Running unconditionally makes that class of gap unreachable rather than
# merely documented.
on:
  pull_request: {}
  workflow_dispatch: {}

# LEAST PRIVILEGE — see appblocks-cli.yml for the full reasoning. Checkout +
# npm ci + tsc/offline node checks only; no upload, comment, issue, push or API
# mutation. `contents: read` is all actions/checkout requires.
permissions:
  contents: read

jobs:
  typecheck-snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (pinned @civitai/app-sdk + @civitai/blocks-react + tsc)
        run: npm ci

      - name: Typecheck App Blocks doc snippets against the pinned SDK
        run: npm run test:snippets:appblocks

      # 🔴 THIS JOB GATES. Measured 2026-08-07: `gh api repos/civitai/
      # civitai-developer-docs/branches/main/protection` -> required contexts
      # `test-cli`, `test-messages`, `test-bridge`, `typecheck-snippets`
      # (strict=false, enforce_admins=false, reviews=none); `rulesets` -> [].
      # This job IS `typecheck-snippets`, so a red run blocks the merge —
      # including the steps below, which are `if: always()` and therefore fail
      # the job rather than being skipped past.
      #
      # This REVERSES the previous note here, which measured a 404 "Branch not
      # protected" on 2026-08-06 and concluded a red run "can be merged straight
      # through". That was true when written and is false now. Nothing about
      # these checks changed — the REPO SETTINGS did, on 2026-08-07.
      #
      # Which is exactly the durable point, so keep it: "safe to require" is a
      # property of the CHECK (offline, repo-local, no upstream input, so it
      # cannot false-fail on someone else's publish); "blocks" is a property of
      # REPO SETTINGS. The two move independently, and this file has now been
      # wrong in BOTH directions by assuming one from the other. Re-measure
      # before calling any job here a gate — never infer it from the job
      # existing, and never infer it from this comment either.
      #
      # THERE IS A THIRD, INDEPENDENT PROPERTY, and leaving it implicit cost a
      # day: a required check must also be able to REPORT on every PR. That is a
      # property of the TRIGGER. GitHub synthesises nothing for a workflow that
      # does not run, so while this file carried a `paths:` filter, "safe to
      # require" + "required in repo settings" still produced a permanent
      # BLOCKED on any PR that touched none of the watched paths — no red run to
      # look at, no way through. Hence the unfiltered `on: pull_request` above.
      # All three properties move independently; hold all three.
      #
      # --offline runs ONLY the single-source half: every first-party version
      # literal in the docs (design-system CDN URLs AND the SDK `sources:`
      # stamps) must equal its declared devDep pin. The freshness half (pin vs
      # npm latest) detects upstream movement and stays on the scheduled
      # appblocks-drift run.
      #
      # Worth requiring because the failure is silent for readers: the
      # design-system literals are copy-paste CDN URLs, and a stale one 404s
      # into an unstyled page with no error; the SDK literals are provenance
      # stamps, and a stale one advertises an API the page does not document.
      - name: First-party pin drift — docs literals vs the declared pin
        if: always()
        run: npm run check:ds-pins -- --offline

      # Both pages document the SAME `civitai` binary. Offline + repo-local: it
      # compares the two pages to each other, not to anything upstream. (Gates
      # — see the note above.)
      - name: CLI install-method parity — the two hosted CLI pages agree
        if: always()
        run: npm run check:cli-install-parity

      # A page/model-slot context mix-up TYPECHECKS (the snippet suite passed
      # 31/31 with the wrong type) and fails only at runtime — as `undefined`
      # fields, or as a FORBIDDEN the block cannot diagnose. Needs its own
      # assertion. (Gates — see the note above.)
      - name: Page-surface context — page apps vs model slots
        if: always()
        run: npm run check:page-context
